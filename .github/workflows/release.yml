name: Nightly

on:
  schedule:
    # Off minute zero: GitHub delays scheduled runs most at the top of the hour.
    - cron: "38 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: none

concurrency:
  group: nightly-release
  cancel-in-progress: true

jobs:
  check_changes:
    name: Check for changes since last nightly
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - id: check
        name: Compare HEAD to last nightly tag
        shell: bash
        run: |
          set -euo pipefail

          last_nightly_tag=""
          while IFS= read -r tag; do
            last_nightly_tag="$tag"
            break
          done < <(git tag --list 'v*-nightly.*' 'nightly-v*' --sort=-creatordate)
          if [[ -z "$last_nightly_tag" ]]; then
            echo "No previous nightly tag found. Proceeding with release."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_nightly_sha=$(git rev-parse "$last_nightly_tag^{commit}")
          head_sha=$(git rev-parse HEAD)
          if [[ "$last_nightly_sha" == "$head_sha" ]]; then
            echo "No changes since $last_nightly_tag. Skipping."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected since $last_nightly_tag."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Quality checks
    needs: [check_changes]
    if: |
      !failure() && !cancelled() &&
      (github.event_name != 'schedule' || needs.check_changes.outputs.has_changes == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      release_name: ${{ steps.release_meta.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/desktop...
              - --filter=t3...
              # The server projection suite imports mobile code whose tsconfig extends Expo's base config.
              - --filter=@t3tools/mobile...
              - --filter=@t3tools/scripts...
              - --filter=@t3tools/oxlint-plugin-t3code...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - id: release_meta
        name: Resolve nightly version
        shell: bash
        env:
          NIGHTLY_SHA: ${{ github.sha }}
          NIGHTLY_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          nightly_date=$(date -u +%Y%m%d)
          node scripts/resolve-nightly-release.ts \
            --date "$nightly_date" \
            --run-number "$NIGHTLY_RUN_NUMBER" \
            --sha "$NIGHTLY_SHA" \
            --github-output

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check formatting
        run: >-
          vp fmt --check
          package.json pnpm-lock.yaml pnpm-workspace.yaml vite.config.ts
          apps/desktop apps/server apps/web packages scripts native oxlint-plugin-t3code

      - name: Lint
        run: >-
          vp lint --report-unused-disable-directives
          vite.config.ts apps/desktop apps/server apps/web packages scripts oxlint-plugin-t3code

      - name: Check resource monitor formatting
        run: cargo fmt --manifest-path native/resource-monitor/Cargo.toml -- --check

      - name: Typecheck
        run: >-
          vp run
          --filter=@t3tools/desktop...
          --filter=t3...
          --filter=@t3tools/scripts...
          --fail-if-no-match
          --concurrency-limit=2
          typecheck

      - name: Test
        run: >-
          vp run
          --filter=@t3tools/desktop...
          --filter=t3...
          --filter=@t3tools/scripts...
          --fail-if-no-match
          test

      - name: Test resource monitor
        run: vp run test:resource-monitor

      - name: Test release flow
        run: vp run release:smoke

  release:
    name: Build and publish macOS arm64 DMG
    needs: [quality]
    if: ${{ !failure() && !cancelled() && needs.quality.result == 'success' }}
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Verify Homebrew tap token
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "HOMEBREW_TAP_TOKEN is required to publish nightly Cask updates." >&2
            exit 1
          fi

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/desktop...
              - --filter=t3...
              - --filter=@t3tools/scripts...

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: native/resource-monitor/target/aarch64-apple-darwin/release/t3-resource-monitor
          key: resource-monitor-aarch64-apple-darwin-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ needs.quality.outputs.version }}"

      - name: Build DMG
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: ${{ steps.resource_monitor_cache.outputs.cache-hit == 'true' }}
        run: >-
          vp run dist:desktop:artifact
          --platform mac
          --target dmg
          --arch arm64
          --build-version "${{ needs.quality.outputs.version }}"
          --no-updates
          --verbose

      - name: Verify DMG output
        id: dmg
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(release/*.dmg)
          if (( ${#artifacts[@]} != 1 )); then
            echo "Expected exactly one DMG, found ${#artifacts[@]}." >&2
            exit 1
          fi
          checksum_output=$(shasum -a 256 "${artifacts[0]}")
          checksum=${checksum_output%% *}
          if [[ ! "$checksum" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Failed to calculate the DMG SHA-256." >&2
            exit 1
          fi
          echo "sha256=$checksum" >> "$GITHUB_OUTPUT"

      - name: Publish nightly prerelease
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.quality.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.quality.outputs.release_name }}
          generate_release_notes: true
          prerelease: true
          make_latest: false
          files: release/*.dmg
          fail_on_unmatched_files: true
          token: ${{ github.token }}

      - name: Checkout Homebrew tap
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Adamekka/homebrew-tap
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - id: cask
        name: Update Homebrew Cask
        shell: bash
        env:
          CASK_VERSION: ${{ needs.quality.outputs.version }}
          CASK_SHA256: ${{ steps.dmg.outputs.sha256 }}
        run: |
          set -euo pipefail
          cask_path="homebrew-tap/Casks/adamekka-t3-code.rb"
          ruby - "$cask_path" "$CASK_VERSION" "$CASK_SHA256" <<'RUBY'
          path, version, sha256 = ARGV
          abort "Invalid nightly version: #{version}" unless version.match?(/\A\d+\.\d+\.\d+-nightly\.\d{8}\.\d+\z/)
          abort "Invalid SHA-256: #{sha256}" unless sha256.match?(/\A[0-9a-f]{64}\z/)

          content = File.read(path)
          replacements = {
            /^  version "[^"]+"$/ => %(  version "#{version}"),
            /^  sha256 "[0-9a-f]{64}"$/ => %(  sha256 "#{sha256}"),
          }
          replacements.each do |pattern, replacement|
            matches = content.scan(pattern).length
            abort "Expected one #{pattern.inspect} stanza in #{path}, found #{matches}" unless matches == 1
            content = content.sub(pattern, replacement)
          end
          File.write(path, content)
          RUBY
          ruby -c "$cask_path"
          git -C homebrew-tap diff --check
          if git -C homebrew-tap diff --quiet -- Casks/adamekka-t3-code.rb; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Homebrew Cask update
        if: steps.cask.outputs.changed == 'true'
        env:
          CASK_VERSION: ${{ needs.quality.outputs.version }}
        run: |
          set -euo pipefail
          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C homebrew-tap add -- Casks/adamekka-t3-code.rb
          git -C homebrew-tap commit -m "adamekka-t3-code: $CASK_VERSION"
          git -C homebrew-tap push origin HEAD:main
